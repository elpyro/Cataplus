plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"


    defaultConfig {
        applicationId "com.cataplus.facturacionycatalogospdf"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 6
        versionName "6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}


dependencies {



    //reciclerView y marterial de librerias
    implementation 'com.google.android.material:material:1.1.0'
    //imagen crooper recortada
    implementation 'com.theartofdev.edmodo:android-image-cropper:2.8.0'
    //forma circular imagenview
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //lector codigo de barras
    implementation 'com.journeyapps:zxing-android-embedded:4.2.0'
    //barra de menus
    implementation 'com.getbase:floatingactionbutton:1.10.1'
    //convertir array y guardar preferencia
    implementation 'com.google.code.gson:gson:2.8.6'
    //otro lector de barras //en caso de error en el manifiesto https://www.youtube.com/watch?v=zvnErKpjhhs
    implementation 'me.dm7.barcodescanner:zxing:1.9.13'
    //otro lector barras2
    implementation 'me.dm7.barcodescanner:zbar:1.9.13'
    //crear pdf
    //PDF
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.0-alpha01'
    implementation group: 'com.itextpdf', name: 'itextpdf', version: '5.5.13.1'
    //https://www.youtube.com/watch?v=FIleHM7u4IY&t=706s
    //visor de pdf en activity
    implementation 'com.github.barteksc:android-pdf-viewer:2.8.1'



    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.firebase:firebase-database:20.0.2'
    implementation 'com.google.firebase:firebase-storage:20.0.0'
    implementation 'com.google.firebase:firebase-firestore:23.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
//    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:25.3.1'
    //noinspection GradleCompatible
    implementation 'com.android.support:design:25.3.1'

    //login
    implementation 'com.firebaseui:firebase-ui-auth:7.2.0'
    implementation 'com.google.firebase:firebase-auth:21.0.1'
    implementation 'com.google.firebase:firebase-core:19.0.2'

    implementation 'com.facebook.android:facebook-android-sdk:[4,5)'

    implementation 'com.google.android.gms:play-services-auth:19.2.0'
    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:28.4.2')

    // Declare the dependency for the Firebase Authentication library
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-analytics'

    //publicidad
    implementation 'com.google.android.gms:play-services-ads:20.4.0'

    //SUCRIPCIONES https://www.youtube.com/watch?v=TmK0w14Uw1c&t=1130s
//    implementation 'com.google.android.material:material:1.2.1'
//    implementation 'com.android.billingclient:billing:3.0.1'
//    def billing_version = "4.0.0"

   // implementation "com.android.billingclient:billing:$billing_version"
}